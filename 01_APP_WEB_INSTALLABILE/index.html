function bindPage(){let search=document.getElementById('searchbox');if(search)search.addEventListener('input',e=>{query=e.target.value;if(page==='attendance'){let people=[...DB.people].filter(p=>(nameOf('people',p)+' '+labelFor('groups',p.group)+' '+p.id).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>nameOf('people',a).localeCompare(nameOf('people',b),'it'));document.getElementById('tableZone').innerHTML=attendanceTable(people)}else{let rows=filterRows(page,query);document.getElementById('tableZone').innerHTML=tableHTML(page,rows,'Nessun risultato');document.getElementById('resultcount').textContent=rows.length+' risultati'}});let csvInput=document.getElementById('csvFile');if(csvInput)csvInput.addEventListener('change',async e=>{const file=e.target.files[0],type=document.getElementById('csvType').value;if(!file)return;try{importCSV(type,await file.text())}catch(err){alert('Importazione CSV non riuscita: '+err.message)}finally{e.target.value=''}});let restore=document.getElementById('restoreFile');if(restore)restore.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let json=JSON.parse(await file.text());if(!json||json.version!==1||!Array.isArray(json.people)||!Array.isArray(json.costumes)||!Array.isArray(json.events))throw Error('Archivio non valido');if(!confirm('Ripristinare '+json.people.length+' figuranti, '+json.costumes.length+' costumi e tutti gli altri registri? I dati attuali saranno sostituiti.'))return;DB={...EMPTY(),...json};for(const k of Object.keys(prefix)){if(!Array.isArray(DB[k]))DB[k]=[]}if(!save())return;activeEventId='';query='';toast('Backup ripristinato');navigate('dashboard')}catch(e){alert('Non è possibile importare questo file: '+e.message)}finally{e.target.value=''}})}

function showModal(t,id){editing={type:t,id:id||null};photoToClear=false;let r=id?get(t,id):{};if(!r){toast('Elemento non trovato');return}if(t==='events'&&!id)r={year:new Date().getFullYear(),title:'Sfilata annuale Cantù Ssota',state:'In preparazione'};if(['assignments','attendance','scenes','rehearsals','expenses'].includes(t)&&!id)r={...r,event:activeEventId};if(t==='people'&&!id)r={...r,availability:'Da confermare'};if(t==='costumes'&&!id)r={...r,state:'Da controllare',era:'Datazione da verificare'};document.getElementById('modalTitle').textContent=(id?'Modifica ':'Nuovo · ')+LABEL[t];let form='<div class="fields">';for(let x of schema[t]){let value=r[x.name]??'',control='',req=x.required?'required':'',placeholder=x.hint?' placeholder="'+E(x.hint)+'"':'';if(x.type==='textarea')control='<textarea id="field_'+x.name+'" name="'+x.name+'" '+req+placeholder+'>'+E(value)+'</textarea>';else if(x.type==='select'||x.type==='ref')control='<select id="field_'+x.name+'" name="'+x.name+'" '+req+'>'+selectOptions(x,value)+'</select>';else if(x.type==='photo')control='<div>'+(r.photo?'<img class="imgprev" src="'+r.photo+'" alt="Anteprima costume"><br><label><input type="checkbox" id="clearphoto"> Rimuovi foto attuale</label><br>':'')+'<input id="field_photo" name="photo" type="file" accept="image/*"><small>Miniatura compressa in locale. Per archiviare le foto originali, conservale in una cartella separata.</small></div>';else control='<input id="field_'+x.name+'" name="'+x.name+'" type="'+x.type+'" value="'+E(value)+'" '+req+(x.type==='number'?' step="any"':'')+'>';form+='<div class="field '+(x.wide?'wide':'')+'"><label for="field_'+x.name+'">'+E(x.label)+(x.required?' *':'')+'</label>'+control+(x.hint&&x.type!=='textarea'?'<small>'+E(x.hint)+'</small>':'')+'</div>'}form+='</div>';document.getElementById('formFields').innerHTML=form;document.getElementById('modal').classList.add('show');document.body.style.overflow='hidden';document.querySelector('#formFields input:not([type=f async function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{try{const ratio=Math.min(1,320/img.width,320/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.58))}catch(e){reject(e)}};img.onerror=()=>reject(Error('Immagine non leggibile'));img.src=reader.result};reader.onerror=()=>reject(Error('File non leggibile'));reader.readAsDataURL(file)})}
async function onEditorSubmit(e){e.preventDefault();if(!editing)return;const {type:t,id}=editing,orig=id?get(t,id):{},form=new FormData(e.target),row={...orig,id:id||nextId(t)};for(const field of schema[t]){if(field.type==='photo')continue;row[field.name]=String(form.get(field.name)||'').trim()};if(t==='costumes'){let p=document.getElementById('field_photo')?.files[0];if(document.getElementById('clearphoto')?.checked)row.photo='';if(p){try{row.photo=await compressImage(p)}catch(err){return alert(err.message)}}}if(['people','groups','costumes','events'].includes(t)){const duplicate={people:null,groups:null,costumes:null,events:DB.events.some(x=>x.id!==id&&x.year===row.year)}[t];if(duplicate){alert('Esiste già una sfilata per l’anno '+row.year+'. Modifica quella esistente.');return}}
if(t==='assignments'){const exists=DB.assignments.find(x=>x.id!==id&&x.event===row.event&&(x.person===row.person||x.costume===row.costume));if(exists){alert('Questa sfilata ha già '+(exists.person===row.person?'un costume assegnato allo stesso figurante.':'lo stesso costume assegnato a un altro figurante.')+' Controlla la scheda '+exists.id+'.');return}const c=get('costumes',row.costume);if(c&&(c.state==='Da riparare'||c.state==='Non disponibile')&&!confirm('Attenzione: il costume risulta '+c.state+'. Assegnarlo comunque?'))return}
if(t==='attendance'&&DB.attendance.some(x=>x.id!==id&&x.event===row.event&&x.person===row.person)){alert('Presenza già registrata per questa persona.');return}

function deleteRow(t,id){
  const item=get(t,id);
  if(!item){alert('Scheda non trovata. Aggiorna la vista e riprova.');return}
  // Linked event and assignment records belong to the removed element;
  // other standalone inventory records keep their history and lose only the reference.
  const deps={
    groups:[['people','group','Scollega']],
    people:[['assignments','person','Elimina'],['attendance','person','Elimina']],
    costumes:[['assignments','costume','Elimina'],['accessories','costume','Scollega'],['maintenance','costume','Scollega'],['sources','linkedCostume','Scollega']],
    events:[['assignments','event','Elimina'],['attendance','event','Elimina'],['scenes','event','Elimina'],['rehearsals','event','Elimina'],['expenses','event','Elimina']]
  };
  const found=(deps[t]||[]).map(([type,field,method])=>({type,field,method,count:DB[type].filter(x=>x[field]===id).length})).filter(x=>x.count>0);
  const explanation=found.length?'\n\nSchede collegate interessate:\n'+found.map(x=>'- '+x.method+' '+x.count+' in '+LABEL[x.type]).join('\n'):'';
  if(!confirm('Eliminare '+LABEL[t]+' '+id+' ('+nameOf(t,item)+')?'+explanation+'\n\nQuesta azione non e reversibile senza un backup JSON.'))return;
  const prev=JSON.stringify(DB);
  for(const link of found){
    if(link.method==='Elimina')DB[link.type]=DB[link.type].filter(x=>x[link.field]!==id);
    else DB[link.type].forEach(x=>{if(x[link.field]===id)x[link.field]=''});
  }
  DB[t]=DB[t].filter(x=>x.id!==id);
  if(!save()){DB=JSON.parse(prev);return}
  if(t==='events'&&activeEventId===id)activeEventId='';
  toast('Scheda eliminata. '+(found.length?'Collegamenti aggiornati.':''));render();
}

function parseCSV(content){const text=content.replace(/^\ufeff/,''),h=text.split(/\r?\n/,1)[0],sep=(h.match(/;/g)||[]).length >= (h.match(/,/g)||[]).length?';':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='\"'){if(quoted&&text[i+1]==='\"'){cell+='\"';i++}else quoted=!quoted}else if(ch===sep&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('Virgolette non bilanciate');row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function importCSV(type,content){const lines=parseCSV(content);if(lines.length<2)throw Error('CSV vuoto o senza righe dati');const norm=s=>String(s||'').trim().toLocaleLowerCase('it');const fieldList=[{name:'id',label:'Codice'},...schema[type].filter(x=>x.type!=='photo')];const map=fieldList.map(f=>lines[0].findIndex(head=>norm(head)===norm(f.label)||norm(head)===norm(f.name)));if(map.slice(1).every(i=>i<0))throw Error('Le colonne non corrispondono a quelle esportate dalla app. Esporta prima un CSV di esempio per vedere i nomi corretti.');const items=[];let nextNumber=Math.max(0,...DB[type].map(x=>Number(String(x.id).split('-').pop())||0));for(let j=1;j<lines.length;j++){let src=lines[j];if(src.every(x=>!x.trim()))continue;let obj={},codeIndex=map[0];for(let i=1;i<fieldList.length;i++){const n=map[i];if(n>=0)obj[fieldList[i].name]=String(src[n]||'').trim()}let code=codeIndex>=0?String(src[codeIndex]||'').trim():'';if(code&&!new RegExp('^'+prefix[type]+'-\\d{3,}$').test(code))throw Error('Codice non valido alla riga '+(j+1)+': '+code);if(!code){nextNumber++;code=prefix[type]+'-'+String(nextNumber).padStart(3,'0')}obj.id=code;for(let f of schema[type].filter(x=>x.required)){if(!obj[f.name])throw Error('Campo obbligatorio '+f.label+' mancante alla riga '+(j+1))}if(items.some(x=>x.id===code))throw Error('Codice duplicato: '+code);items.push(obj)}if(items.length===0)throw Error('Nessuna riga importabile');if(!confirm('Importare '+items.length+' schede nella sezione '+LABEL[type]+'? I codici esistenti saranno aggiornati. Prima di continuare è consigliato fare un backup.'))return;let updated=DB[type].map(x=>({...x})),created=0,changed=0;for(let item of items){let index=updated.findIndex(x=>x.id===item.id);if(index<0){updated.push(item);created++}else{updated[index]={...updated[index],...item};changed++}}DB[type]=updated;if(save()){toast('CSV importato: '+created+' nuove schede, '+changed+' aggiornate');render()}}
function printSingle(type,id){const r=get(type,id);if(!r)return;let flds=schema[type].filter(f=>f.type!=='photo');const fields=flds.map(f=>'<tr><th style="width:27%">'+E(f.label)+'</th><td>'+E(f.type==='ref'?labelFor(f.target,r[f.name]):r[f.name]||'—')+'</td></tr>').join('');let heading=type==='people'?'Scheda figurante':'Scheda costume';let photo=type==='costumes'&&r.photo?'<div style="float:right;margin:0 0 15px 20px"><img src="'+r.photo+'" alt="Costume" style="width:155px;max-height:210px;object-fit:contain"></div>':'';document.getElementById('printarea').innerHTML='<div class="pagehead"><h1>CANTÙ SSOTA · '+heading+'</h1><p>Martinengo · 1395–1470 · '+E(id)+'</p></div>'+photo+'<h2>'+E(nameOf(type,r))+'</h2><table style="width:'+(photo?'75%':'100%')+'"><tbody>'+fields+'</tbody></table><p style="clear:both;margin-top:25px">Aggiornamento scheda: __________________ &nbsp; Firma responsabile: __________________</p>';window.print()}

if(!head)return;document.getElementById('printarea').innerHTML='<div class="pagehead"><h1>CANTÙ SSOTA · '+E(head)+'</h1><div>Martinengo · 1395–1470 · '+E(type==='people'||type==='costumes'||type==='maintenance'||type==='labels'?'Archivio permanente':evName)+'</div></div><p>Data stampa: '+dateIT(new Date().toISOString().slice(0,10))+' · Totale righe: '+rows.length+'</p><table class="print-report print-report--'+E(type)+'"><colgroup>'+printColumnWidths(type,cols.length).map(w=>'<col style="width:'+w+'%">').join('')+'</colgroup><thead><tr>'+cols.map(x=>'<th>'+E(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+E(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="print-signatures">Responsabile: ___________________________ &nbsp;&nbsp; Firma: ___________________________</p>';window.print()}
function demo(){const total=Object.keys(prefix).reduce((a,k)=>a+DB[k].length,0);if(total){alert('Per evitare di mescolare dati fittizi e reali, la demo si può caricare soltanto su un archivio vuoto.');return}if(!confirm('Caricare 3 figuranti fittizi, 3 costumi, un gruppo e una sfilata di esempio? Sono dati DIMOSTRATIVI.'))return;DB.groups.push({id:'GRP-001',name:'Gruppo prova',leader:'Referente prova',order:'1'});for(let i=1;i<=3;i++){let nn=String(i).padStart(3,'0');DB.people.push({id:'FIG-'+nn,name:'Figurante',surname:'Esempio '+i,group:'GRP-001',historicalRole:'Personaggio da definire',availability:'Da confermare'});DB.costumes.push({id:'COS-'+nn,name:'Costume dimostrativo '+i,state:'Pronto',era:'1446–1470',components:'Tunica; copricapo; cintura',location:'Armadio PROVA'});}let evt={id:'EVT-001',title:'Evento dimostrativo — DA CANCELLARE',year:'2027',state:'In preparazione'};DB.events.push(evt);activeEventId=evt.id;for(let i=1;i<=2;i++){let nn=String(i).padStart(3,'0');DB.assignments.push({id:'ASS-'+nn,event:evt.id,person:'FIG-'+nn,costume:'COS-'+nn,position:String(i),state:'Assegnato'})}if(save()){toast('Dati dimostrativi caricati');navigate('dashboard')}}
function reset(){
 const total=Object.keys(prefix).reduce((a,k)=>a+DB[k].length,0);
 if(!confirm('AZZERAMENTO ARCHIVIO LOCALE\n\nEliminare definitivamente tutte le '+total+' schede presenti in questo browser? Prima esporta un backup JSON se vuoi conservarle.'))return;
 if(!confirm('ULTIMA CONFERMA\n\nSei sicuro di voler cancellare TUTTI i dati sul dispositivo corrente?'))return;
 const prev=JSON.stringify(DB);
 DB=EMPTY();activeEventId='';query='';
 if(!save()){DB=JSON.parse(prev);return}
 toast('Archivio locale azzerato');navigate('dashboard');
}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]'),go=e.target.closest('[data-go]'),add=e.target.closest('[data-new]'),a=e.target.closest('[data-action]'),pr=e.target.closest('[data-print]'),cs=e.target.closest('[data-csv]');if(nav)navigate(nav.dataset.nav);if(go)navigate(go.dataset.go);if(add)showModal(add.dataset.new);if(a){let ac=a.dataset.action;if(ac.startsWith('edit:')){let [,t,id]=ac.split(':');showModal(t,id)}else if(ac.startsWith('delete:')){let [,t,id]=ac.split(':');deleteRow(t,id)}else if(ac.startsWith('printone:')){let [,t,id]=ac.split(':');printSingle(t,id)}else if(ac==='backup')backup();else if(ac==='sharebackup')shareBackup();else if(ac==='demo')demo();else if(ac==='reset')reset()}if(pr)printReport(pr.dataset.print);if(cs)csv(cs.dataset.csv)});
document.addEventListener('change',e=>{if(e.target.id==='activeEvent'){activeEventId=e.target.value;render()}if(e.target.classList.contains('quickAttend'))attendanceUpdate(e.target.dataset.person,'state',e.target.value);if(e.target.classList.contains('attendanceNote'))attendanceUpdate(e.target.dataset.person,'notes',e.target.value)});
